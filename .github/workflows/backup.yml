name: Backup

on:
  schedule:
    - cron: '0 8 * * *' # todos los dias 8am UTC (3am hora Colombia), sin nadie usando la app
  workflow_dispatch: # para poder correrlo a mano desde GitHub cuando haga falta

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # le pide el backup al propio servidor de produccion (ya tiene acceso a Atlas,
      # asi no hay que whitelistear nada nuevo -- solo un token secreto compartido)
      - name: pedir el backup a produccion
        run: |
          curl --fail -H "Authorization: Bearer ${{ secrets.BACKUP_TOKEN }}" \
            https://fooddata.me/api/backup -o backup.json
      - uses: actions/upload-artifact@v4
        with:
          name: backup-mongo
          path: backup.json
          retention-days: 90
