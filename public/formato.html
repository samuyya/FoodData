<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formato - Seal Zenith</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img id="logo-empresa" class="logo-empresa" alt="" hidden />
      <strong id="nombre-empresa">...</strong>
    </div>
    <div class="topbar-right">
      <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <div class="card formato-cabecera">
      <h1 class="titulo-pagina" id="formato-titulo">Cargando...</h1>
      <p class="subtitulo-pagina">
        <span class="meta-label">Fecha:</span>
        <strong id="formato-fecha"></strong>
        <span id="badge-admin-activo" class="badge-admin" hidden>
          Sesión de administrador: <strong id="badge-admin-nombre"></strong>
        </span>
      </p>
    </div>

    <div id="banner-pendientes" class="banner banner-warning" hidden></div>
    <div id="banner-info" class="banner banner-info" hidden></div>

    <form id="form-registro" class="card">
      <p id="formato-dia-actual" class="dia-objetivo" hidden></p>

      <label class="campo">
        <span>Responsable</span>
        <input
          type="text"
          name="responsable"
          id="input-responsable"
          autocomplete="off"
          pattern="[A-Za-zÀ-ÿÑñ\s]+"
          title="Solo letras y espacios"
        />
        <small class="ayuda" id="responsable-hint">Escribe tu nombre (solo letras y espacios).</small>
      </label>

      <label class="campo">
        <span>Observaciones</span>
        <textarea name="observaciones" id="input-observaciones" rows="4" placeholder="Comentarios u observaciones del día..."></textarea>
      </label>

      <p id="msg-registro" class="mensaje" hidden></p>

      <div class="acciones-formato">
        <button type="submit" id="btn-guardar" class="btn-primario">Guardar</button>
        <button type="button" id="btn-ver-registros" class="btn-secundario">Ver registros</button>
        <button type="button" id="btn-volver" class="btn-secundario">Volver a formatos</button>
      </div>
    </form>

    <section id="seccion-empleados" class="card" hidden>
      <h2>Empleados registrados</h2>
      <p class="ayuda">Crea, edita o elimina los empleados de tu empresa. Toca un empleado para abrir su formulario individual.</p>

      <form id="form-nuevo-empleado" class="form-inline">
        <label class="campo">
          <span>Nuevo empleado</span>
          <input
            type="text"
            name="nombre"
            placeholder="Nombre completo"
            required
            pattern="[A-Za-zÀ-ÿÑñ\s]+"
            title="Solo letras y espacios"
          />
        </label>
        <button type="submit" class="btn-primario">Agregar</button>
      </form>
      <p id="msg-empleado" class="mensaje" hidden></p>

      <ul id="lista-empleados" class="lista-empleados"></ul>
    </section>
  </main>

  <div id="modal-empleado" class="modal-backdrop" hidden>
    <div class="modal">
      <h2>Editar empleado</h2>
      <form id="form-editar-empleado" class="form">
        <input type="hidden" name="id" />
        <label class="campo">
          <span>Nombre</span>
          <input
            type="text"
            name="nombre"
            required
            pattern="[A-Za-zÀ-ÿÑñ\s]+"
            title="Solo letras y espacios"
          />
        </label>
        <p id="modal-empleado-error" class="mensaje mensaje-error" hidden></p>
        <div class="modal-acciones">
          <button type="button" id="btn-cancelar-editar-empleado" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/util.js"></script>
  <script src="/js/formato.js"></script>
</body>
</html>
