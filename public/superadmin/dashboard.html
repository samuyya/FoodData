<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Superadmin</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <strong>Panel Superadmin</strong>
    </div>
    <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
  </header>

  <main class="contenedor">
    <section class="card">
      <h2>Crear empresa</h2>
      <form id="form-empresa" class="form" enctype="multipart/form-data">
        <label class="campo">
          <span>Nombre de la empresa</span>
          <input type="text" name="nombre" required />
        </label>
        <label class="campo">
          <span>Email de acceso</span>
          <input type="email" name="email" required />
        </label>
        <label class="campo">
          <span>Contraseña</span>
          <input type="password" name="password" required />
        </label>
        <label class="campo">
          <span>Logo (png, jpg, webp, svg — máx. 2MB)</span>
          <input type="file" name="logo" accept="image/*" />
        </label>

        <fieldset class="campo campo-fieldset">
          <legend>Formatos que usará esta empresa</legend>
          <div id="checkboxes-formatos" class="checkboxes-formatos"></div>
          <p class="ayuda">Marca al menos uno. La empresa solo verá los formatos seleccionados.</p>
        </fieldset>

        <button type="submit" class="btn-primario">Crear empresa</button>
        <p class="mensaje" id="msg-empresa" hidden></p>
      </form>
    </section>

    <section class="card">
      <h2>Empresas registradas</h2>
      <ul id="lista-empresas" class="lista-empresas"></ul>
    </section>

    <section class="card">
      <h2>Crear administrador</h2>
      <form id="form-admin" class="form">
        <label class="campo">
          <span>Empresa</span>
          <select name="empresa_id" required></select>
        </label>
        <label class="campo">
          <span>Nombre del administrador</span>
          <input type="text" name="nombre" required />
        </label>
        <label class="campo">
          <span>Contraseña de acceso a formatos restringidos</span>
          <input type="password" name="password" required />
        </label>
        <button type="submit" class="btn-primario">Crear administrador</button>
        <p class="mensaje" id="msg-admin" hidden></p>
      </form>
    </section>

    <section class="card">
      <h2>Administradores</h2>
      <ul id="lista-admins" class="lista-empresas"></ul>
    </section>
  </main>

  <div id="modal-editar-empresa" class="modal-backdrop" hidden>
    <div class="modal modal-grande">
      <h2>Editar empresa</h2>
      <form id="form-editar-empresa" class="form" enctype="multipart/form-data">
        <input type="hidden" name="id" />

        <label class="campo">
          <span>Email (no editable)</span>
          <input type="email" name="email" readonly class="input-readonly" />
        </label>

        <label class="campo">
          <span>Nombre de la empresa</span>
          <input type="text" name="nombre" required />
        </label>

        <label class="campo">
          <span>Nueva contraseña (dejar vacío para mantener la actual)</span>
          <input type="password" name="password" autocomplete="new-password" />
        </label>

        <label class="campo">
          <span>Logo actual</span>
          <div class="logo-preview-wrap">
            <img id="preview-logo-actual" class="mini-logo logo-preview" alt="" hidden />
            <span id="preview-logo-vacio" class="ayuda">Sin logo</span>
          </div>
        </label>

        <label class="campo">
          <span>Reemplazar logo (opcional, máx. 2MB)</span>
          <input type="file" name="logo" accept="image/*" />
        </label>

        <fieldset class="campo campo-fieldset">
          <legend>Formatos activos</legend>
          <div id="checkboxes-formatos-editar" class="checkboxes-formatos"></div>
          <p class="ayuda">Marca al menos uno.</p>
        </fieldset>

        <p id="msg-editar-empresa" class="mensaje" hidden></p>

        <div class="modal-acciones">
          <button type="button" id="btn-cancelar-editar-empresa" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/superadmin-dashboard.js"></script>
</body>
</html>
