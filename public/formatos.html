<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formatos - FoodData</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="sub-body">
  <header class="sub-topbar">
    <div class="sub-topbar-inner">
      <button type="button" id="btn-volver" class="btn-secundario btn-volver-sub">← Volver</button>

      <div class="sub-encabezado">
        <div class="sub-titulo-grupo">
          <h1 class="titulo-pagina" id="titulo-pagina">Formatos</h1>
          <p class="subtitulo-pagina" id="subtitulo-pagina">Selecciona una carpeta.</p>
        </div>

        <section class="establecimiento">
          <div class="establecimiento-logo">
            <img loading="lazy" decoding="async" id="logo-empresa" class="establecimiento-logo-img" alt="Logo de la empresa" hidden />
            <span id="logo-placeholder" class="establecimiento-logo-ph">Logo</span>
          </div>
          <div class="establecimiento-info">
            <span class="establecimiento-label">Restaurante</span>
            <strong id="nombre-empresa" class="establecimiento-nombre">...</strong>
          </div>
        </section>
      </div>
    </div>
  </header>

  <main class="sub-main">
    <div class="fila-acciones-formatos">
      <button type="button" id="btn-abrir-reporte" class="btn-secundario">📄 Generar reporte de formatos</button>
    </div>

    <div class="controles-reporte card" id="panel-reporte" hidden>
      <h2 style="margin-top:0">Reporte de formatos</h2>
      <p class="ayuda" style="margin-top:-.5rem">Se ve en pantalla; usa "Imprimir" si quieres guardarlo como PDF.</p>

      <div class="controles-reporte-fila">
        <button type="button" class="btn-primario" id="btn-generar-mes" style="height:36px">📄 Generar reporte de este mes</button>
        <button type="button" class="controles-reporte-toggle" id="btn-toggle-personalizado">Elegir un rango de fechas personalizado</button>
      </div>

      <div class="controles-reporte-personalizado" id="rango-personalizado" hidden>
        <div class="controles-reporte-fila">
          <label class="campo">
            <span>Desde</span>
            <input type="date" id="input-desde" />
          </label>
          <label class="campo">
            <span>Hasta</span>
            <input type="date" id="input-hasta" />
          </label>
          <button type="button" class="btn-secundario" id="btn-generar-rango" style="height:36px">Generar este rango</button>
        </div>
      </div>
    </div>

    <div class="hoja" id="hoja-reporte" hidden></div>

    <div class="barra-imprimir" id="barra-imprimir" hidden>
      <button type="button" class="btn-secundario" id="btn-imprimir">🖨️ Imprimir / Guardar como PDF</button>
    </div>

    <!-- Vista: selector de carpetas -->
    <div id="vista-carpetas">
      <ul id="lista-carpetas" class="grid-formatos"></ul>
    </div>

    <!-- Vista: formatos dentro de una carpeta -->
    <div id="vista-formatos" hidden>
      <ul id="lista-formatos" class="grid-formatos"></ul>
    </div>
  </main>

  <!-- Modal contraseña administración -->
  <div id="modal-admin" class="modal-backdrop" hidden role="dialog" aria-modal="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo">Acceso a Administración</h2>
      <p class="subtitulo">Ingresa la contraseña de administrador para abrir esta carpeta.</p>

      <form id="form-admin-pass" class="form">
        <label class="campo">
          <span>Contraseña de administrador</span>
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <p id="modal-error" class="mensaje mensaje-error" hidden></p>
        <div class="modal-acciones">
          <button type="button" id="modal-cancelar" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Verificar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/util.js"></script>
  <script src="/js/formatos.js"></script>
</body>
</html>
