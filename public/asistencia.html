<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistencia - Seal Zenith</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img id="logo-empresa" class="logo-empresa" alt="" hidden />
      <strong id="nombre-empresa">...</strong>
    </div>
    <div class="topbar-right">
      <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <div class="fila-acciones-top">
      <button type="button" id="btn-volver" class="btn-secundario btn-volver-menu">← Volver al menú</button>
      <button type="button" id="btn-registro" class="btn-secundario">Ver registro de horas</button>
    </div>
    <h1 class="titulo-pagina">Asistencia</h1>
    <p class="subtitulo-pagina">Registra tu entrada o salida del día con una foto.</p>

    <section id="paso-seleccion" class="card">
      <h2>1. Selecciona tu nombre</h2>
      <ul id="lista-empleados-asistencia" class="lista-empleados"></ul>
    </section>

    <section id="paso-camara" class="card" hidden>
      <h2>2. Toma tu foto</h2>
      <p class="empleado-activo">Empleado: <strong id="nombre-seleccionado"></strong></p>
      <p id="estado-empleado" class="dia-objetivo"></p>

      <div class="camara-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" class="foto-preview" hidden></canvas>
      </div>

      <p id="msg-asistencia" class="mensaje" hidden></p>

      <div class="acciones-camara">
        <button type="button" id="btn-tomar" class="btn-primario">Tomar foto</button>
        <button type="button" id="btn-repetir" class="btn-secundario" hidden>Repetir foto</button>
        <button type="button" id="btn-confirmar" class="btn-primario" hidden>Confirmar y registrar</button>
        <button type="button" id="btn-cancelar-camara" class="btn-secundario">Cancelar</button>
      </div>
    </section>

    <section id="paso-resultado" class="card" hidden>
      <div id="resultado-banner" class="banner banner-info"></div>
      <button type="button" id="btn-otro" class="btn-primario">Registrar otro empleado</button>
    </section>
  </main>

  <script src="/js/util.js"></script>
  <script src="/js/asistencia.js"></script>
</body>
</html>
