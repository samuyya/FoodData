<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistencia - Seal Zenith</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img id="logo-empresa" class="logo-empresa" alt="" hidden />
      <strong id="nombre-empresa">...</strong>
    </div>
    <div class="topbar-right">
      <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <button type="button" id="btn-volver" class="btn-secundario btn-volver-menu">← Volver al menú</button>
    <h1 class="titulo-pagina">Asistencia</h1>
    <p class="subtitulo-pagina">Selecciona tu nombre para registrar tu entrada o salida del día.</p>

    <div id="area-empleados" class="card">
      <p class="ayuda">
        La lista de empleados y la cámara se construirán en las siguientes fases.
        Esta es la estructura base de la sección de Asistencia.
      </p>
    </div>
  </main>

  <script src="/js/util.js"></script>
  <script src="/js/asistencia.js"></script>
</body>
</html>
