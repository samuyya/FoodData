<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú - Seal Zenith</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo-establecimiento">
      <img id="logo-empresa" class="logo-empresa-img" alt="" hidden />
      <span id="logo-placeholder" class="logo-placeholder">Logo del establecimiento</span>
    </div>
    <h1 class="nombre-establecimiento" id="nombre-empresa">...</h1>
    <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
  </header>

  <main class="contenedor">
    <div class="caja-proyecto">
      <span class="nombre-proyecto">Seal Zenith</span>
    </div>

    <h2 class="label-menu">Menú Principal</h2>

    <div class="botones-menu">
      <button type="button" class="boton-menu" id="btn-formatos">Formatos</button>
      <button type="button" class="boton-menu" id="btn-asistencia">Asistencia</button>
      <button type="button" class="boton-menu" id="btn-capacitaciones">Capacitaciones</button>
    </div>

    <p id="msg-menu" class="banner banner-info" hidden></p>
  </main>

  <script src="/js/util.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
