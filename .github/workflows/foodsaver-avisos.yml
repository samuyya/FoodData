# foodsaver:contacto — avisos de vencimiento del modulo del hogar (modulos/foodsaver)
name: Avisos del hogar

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 7:00 a. m. en Colombia (GitHub puede atrasarse unos minutos)
  workflow_dispatch:

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      # despierta a Render si estaba dormido y le pide mandar los avisos del dia.
      # se puede repetir sin duplicar: cada producto avisa una sola vez
      - name: pedir los avisos a produccion
        run: |
          curl --fail --retry 3 --retry-delay 20 --max-time 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.FOODSAVER_AVISOS_TOKEN }}" \
            https://fooddata.me/api/despensa/avisos/ejecutar
