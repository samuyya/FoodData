<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formatos - FoodData</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="sub-body">
  <header class="sub-topbar">
    <div class="sub-topbar-inner">
      <button type="button" id="btn-volver" class="btn-secundario btn-volver-sub">← Volver</button>

      <div class="sub-encabezado">
        <div class="sub-titulo-grupo">
          <h1 class="titulo-pagina" id="titulo-pagina">Formatos</h1>
          <p class="subtitulo-pagina" id="subtitulo-pagina">Selecciona una carpeta.</p>
        </div>

        <section class="establecimiento">
          <div class="establecimiento-logo">
            <img id="logo-empresa" class="establecimiento-logo-img" alt="" hidden />
            <span id="logo-placeholder" class="establecimiento-logo-ph">Logo</span>
          </div>
          <div class="establecimiento-info">
            <span class="establecimiento-label">Restaurante</span>
            <strong id="nombre-empresa" class="establecimiento-nombre">...</strong>
          </div>
        </section>
      </div>
    </div>
  </header>

  <main class="sub-main">
    <!-- Vista: selector de carpetas -->
    <div id="vista-carpetas">
      <ul id="lista-carpetas" class="grid-formatos"></ul>
    </div>

    <!-- Vista: formatos dentro de una carpeta -->
    <div id="vista-formatos" hidden>
      <ul id="lista-formatos" class="grid-formatos"></ul>
    </div>
  </main>

  <!-- Modal contraseña administración -->
  <div id="modal-admin" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo">Acceso a Administración</h2>
      <p class="subtitulo">Ingresa la contraseña de administrador para abrir esta carpeta.</p>

      <form id="form-admin-pass" class="form">
        <label class="campo">
          <span>Contraseña de administrador</span>
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <p id="modal-error" class="mensaje mensaje-error" hidden></p>
        <div class="modal-acciones">
          <button type="button" id="modal-cancelar" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Verificar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/util.js"></script>
  <script src="/js/formatos.js"></script>
</body>
</html>
