<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programas - FoodData</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="sub-body">
  <header class="sub-topbar">
    <div class="sub-topbar-inner">
      <button type="button" id="btn-volver" class="btn-secundario btn-volver-sub">← Volver al menú</button>

      <div class="sub-encabezado">
        <div class="sub-titulo-grupo">
          <h1 class="titulo-pagina">Programas</h1>
        </div>

        <section class="establecimiento">
          <div class="establecimiento-logo">
            <img loading="lazy" decoding="async" id="logo-empresa" class="establecimiento-logo-img" alt="Logo de la empresa" hidden />
            <span id="logo-placeholder" class="establecimiento-logo-ph">Logo</span>
          </div>
          <div class="establecimiento-info">
            <span class="establecimiento-label">Restaurante</span>
            <strong id="nombre-empresa" class="establecimiento-nombre">...</strong>
          </div>
        </section>
      </div>
    </div>
  </header>

  <main class="sub-main">
    <ul id="lista-programas" class="lista-programas"></ul>
  </main>

  <!-- Modal de detalle del programa -->
  <div id="modal-programa" class="modal-backdrop" hidden role="dialog" aria-modal="true">
    <div class="modal modal-programa" role="dialog" aria-modal="true" aria-labelledby="mp-titulo">
      <div class="modal-programa-cabecera">
        <div class="modal-programa-numero" id="mp-numero">1</div>
        <div class="modal-programa-titulo-grupo">
          <span class="modal-programa-icono" id="mp-icono">📋</span>
          <h2 class="modal-programa-titulo" id="mp-titulo">Título</h2>
        </div>
        <button type="button" id="mp-cerrar" class="modal-cerrar-x" aria-label="Cerrar">✕</button>
      </div>

      <div class="modal-programa-cuerpo">
        <section class="modal-programa-seccion">
          <h3 class="modal-programa-subtitulo">📝 Descripción</h3>
          <p class="modal-programa-descripcion" id="mp-descripcion"></p>
        </section>

        <section class="modal-programa-seccion">
          <h3 class="modal-programa-subtitulo">📎 Documentos disponibles</h3>
          <p class="ayuda" style="margin: 0 0 .5rem; font-size:.82rem;">Toca un documento para descargarlo.</p>
          <ul class="modal-programa-docs" id="mp-docs"></ul>
        </section>
      </div>

      <div class="modal-programa-acciones">
        <button type="button" id="mp-cerrar-btn" class="btn-primario">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="/js/util.js"></script>
  <script src="/js/programas.js"></script>
</body>
</html>
