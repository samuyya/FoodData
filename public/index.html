<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - FoodData</title>
  <link rel="icon" href="/img/icon-fooddata.png" type="image/png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="login-wrap">
    <span class="deco-linea deco-linea-1"></span>
    <span class="deco-linea deco-linea-2"></span>
    <span class="deco-linea deco-linea-3"></span>

    <section class="login-card">
      <img
        src="/img/logo-fooddata.png"
        class="login-logo"
        alt="FoodData — Un software que garantiza el más alto estándar sanitario"
      />

      <form id="form-login" class="form">
        <label class="campo">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>

        <label class="campo">
          <span>Contraseña</span>
          <input type="password" name="password" required autocomplete="current-password" />
        </label>

        <button type="submit" class="btn-primario">Iniciar sesión</button>

        <p id="msg-error" class="mensaje mensaje-error" role="alert" hidden></p>
      </form>
    </section>
  </main>

  <script src="/js/util.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
