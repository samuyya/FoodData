<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú - FoodData</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="menu-body">
  <header class="menu-topbar">
    <img src="/img/logo-solo.fooddata.png" class="menu-marca-logo" alt="FoodData" />
    <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
  </header>

  <main class="menu-main">
    <section class="establecimiento">
      <div class="establecimiento-logo">
        <img id="logo-empresa" class="establecimiento-logo-img" alt="" hidden />
        <span id="logo-placeholder" class="establecimiento-logo-ph">Logo</span>
      </div>
      <div class="establecimiento-info">
        <span class="establecimiento-label">Restaurante</span>
        <h1 id="nombre-empresa" class="establecimiento-nombre">...</h1>
      </div>
    </section>

    <h2 class="menu-label">Menú Principal</h2>

    <nav class="menu-botones">
      <button type="button" class="menu-boton" id="btn-formatos">
        <span class="menu-boton-icono">📋</span>
        <span class="menu-boton-texto">Formatos</span>
        <span class="menu-boton-flecha">›</span>
      </button>
      <button type="button" class="menu-boton" id="btn-asistencia">
        <span class="menu-boton-icono">📅</span>
        <span class="menu-boton-texto">Asistencia</span>
        <span class="menu-boton-flecha">›</span>
      </button>
      <button type="button" class="menu-boton" id="btn-capacitaciones">
        <span class="menu-boton-icono">🎓</span>
        <span class="menu-boton-texto">Capacitaciones</span>
        <span class="menu-boton-flecha">›</span>
      </button>
      <button type="button" class="menu-boton" id="btn-programas">
        <span class="menu-boton-icono">🗂️</span>
        <span class="menu-boton-texto">Programas</span>
        <span class="menu-boton-flecha">›</span>
      </button>
    </nav>

    <p id="msg-menu" class="banner banner-info" hidden></p>
  </main>

  <footer class="menu-footer">
    © <span id="anio-actual">2026</span> FoodData · Todos los derechos reservados
  </footer>

  <script src="/js/util.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
