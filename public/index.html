<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - Inocuidad Alimentaria</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <header class="login-head">
        <h1>Inocuidad Alimentaria</h1>
        <p class="subtitulo">Control de calidad para empresas del sector alimentario</p>
      </header>

      <form id="form-login" class="form">
        <label class="campo">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>

        <label class="campo">
          <span>Contraseña</span>
          <input type="password" name="password" required autocomplete="current-password" />
        </label>

        <button type="submit" class="btn-primario">Iniciar sesión</button>

        <p id="msg-error" class="mensaje mensaje-error" role="alert" hidden></p>
      </form>
    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
